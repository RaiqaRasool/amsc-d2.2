include:
  - ../jlab_archiver_client/compose.yml

services:
  web:
    build: .
    user: "${UID:-10001}:${GID:-10001}"
    env_file:
      - .env
    environment:
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ${MYA_EXPORT_HOST_DIR:-./mya-output}:/mya-output:Z
    command: python app.py

  worker:
    build: .
    user: "${UID:-10001}:${GID:-10001}"
    depends_on:
      myquery:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORKER_POLL_INTERVAL: "2"
    volumes:
      - .:/app
      - ${MYA_EXPORT_HOST_DIR:-./mya-output}:/mya-output:Z
    command: python worker.py

  monitor:
    build: .
    user: "${UID:-10001}:${GID:-10001}"
    env_file:
      - .env
    environment:
      MONITOR_POLL_INTERVAL: "15"
    volumes:
      - .:/app
    command: python monitor.py
